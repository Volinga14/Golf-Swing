name: SwingLab Preview checks
on:
  push:
    branches: [pwa-glab-neural-api]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install video test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:frontend
      - if: ${{ !cancelled() }}
        run: npm run test:browser
      - if: ${{ !cancelled() }}
        run: node tests/segment-preview-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Web-test-evidence
          path: .test-artifacts/
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: bash android/gradlew -p android testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SwingLab-0.7-Preview-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
