name: SwingLab Preview checks
on:
  push:
    branches: [pwa-glab-neural-api]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install video test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:frontend
      - if: ${{ !cancelled() }}
        run: npm run test:browser
      - if: ${{ !cancelled() }}
        run: node tests/segment-preview-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Web-test-evidence
          include-hidden-files: true
          path: .test-artifacts/
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: bash android/gradlew -p android testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SwingLab-0.8-Preview-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  qa-summary:
    needs: web
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Web-test-evidence
          path: qa-evidence
      - name: Save synthetic UI test result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'qa/preview-results';
            const path = 'qa/latest-flow.json';
            const file = 'qa-evidence/flow-result.json';
            const result = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {status: 'no-flow-result'};
            const {owner, repo} = context.repo;
            try { await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch}); }
            catch (e) { if (e.status !== 404) throw e; await github.rest.git.createRef({owner, repo, ref: 'refs/heads/' + branch, sha: context.sha}); }
            let sha;
            try { sha = (await github.rest.repos.getContent({owner, repo, path, ref: branch})).data.sha; }
            catch (e) { if (e.status !== 404) throw e; }
            const content = Buffer.from(JSON.stringify({source_sha: context.sha, run_id: context.runId, result}, null, 2)).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner, repo, branch, path, sha, content, message: 'Record synthetic Preview UI test result'});
