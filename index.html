<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>GLAB Swing PWA</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Swing Lab · GLAB Neural Engine</p>
        <h1>Análisis DTL de swing</h1>
        <p class="subtitle">Sube un vídeo y la PWA lo envía al backend GLAB para detectar fases del swing.</p>
      </div>
      <div class="status-pill" id="healthBadge">Sin comprobar</div>
    </header>

    <section class="card">
      <h2>1. Backend GLAB</h2>
      <label class="field">
        <span>API base</span>
        <input id="apiBase" type="url" placeholder="http://localhost:8000" />
      </label>
      <div class="row">
        <button id="saveApiBtn">Guardar API</button>
        <button id="healthBtn" class="secondary">Comprobar health</button>
      </div>
      <pre id="healthOutput" class="output small">Pendiente.</pre>
    </section>

    <section class="card">
      <h2>2. Vídeo</h2>
      <label class="fileBox">
        <input id="videoInput" type="file" accept="video/*" />
        <span>Seleccionar vídeo DTL</span>
      </label>
      <video id="videoPreview" controls playsinline muted></video>

      <div class="grid">
        <label class="field">
          <span>Vista</span>
          <select id="viewInput">
            <option value="dtl" selected>DTL / Down-the-line</option>
            <option value="face_on">Face-on</option>
            <option value="unknown">Unknown</option>
          </select>
        </label>
        <label class="field">
          <span>Palo</span>
          <input id="clubInput" type="text" value="unknown" />
        </label>
        <label class="field">
          <span>Frames</span>
          <input id="numFramesInput" type="number" min="16" max="160" value="48" />
        </label>
        <label class="field">
          <span>Image size</span>
          <input id="imageSizeInput" type="number" min="96" max="256" value="144" />
        </label>
      </div>

      <label class="check">
        <input id="motionWindowInput" type="checkbox" checked />
        <span>Usar ventana de movimiento</span>
      </label>

      <button id="analyzeBtn" class="primary">Analizar con GLAB</button>
      <div id="progress" class="progress hidden"><div></div></div>
    </section>

    <section class="card">
      <h2>3. Resultado</h2>
      <div id="summary" class="summary">Todavía no hay análisis.</div>
      <div class="resultGrid">
        <div>
          <h3>Fases principales</h3>
          <table id="phaseTable"></table>
        </div>
        <div>
          <h3>8 eventos</h3>
          <table id="eventTable"></table>
        </div>
      </div>
      <h3>JSON</h3>
      <pre id="jsonOutput" class="output">Sin resultado.</pre>
    </section>

    <section class="card">
      <h2>Historial local</h2>
      <div class="row">
        <button id="clearHistoryBtn" class="secondary">Borrar historial</button>
      </div>
      <div id="historyList" class="history"></div>
    </section>
  </main>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
