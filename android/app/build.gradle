plugins { id 'com.android.application' }
android {
 namespace 'com.swinglab.mobile'
 compileSdk 35
 defaultConfig { applicationId 'com.swinglab.mobile'; minSdk 28; targetSdk 35; versionCode 8; versionName '0.8-preview'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { debug { applicationIdSuffix '.preview'; debuggable true } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1'; implementation 'androidx.browser:browser:1.8.0'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1'; androidTestImplementation 'androidx.test:core:1.6.1' }
def webFiles = tasks.register('syncSwingLabAssets', Sync) {
 from('../..') { include '*.html', '*.css', '*.js', '*.txt', '*.webmanifest', 'assets/**', 'lab/**'; exclude 'lab/README.md' }
 into(layout.projectDirectory.dir('src/main/assets'))
}
tasks.named('preBuild').configure { dependsOn(webFiles) }
